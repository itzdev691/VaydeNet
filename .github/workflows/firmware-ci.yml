name: VaydeNet Firmware CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run host tests
        run: bash tests/run_host_tests.sh

  firmware-build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - espnow_esp32s3
          - espnow_esp32s3_mini
          - espnow_esp32c5
          - esp32-s2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('apps/node/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-${{ matrix.environment }}-
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade "platformio==6.1.19"

      - name: Build firmware
        run: pio run --project-dir apps/node --environment "${{ matrix.environment }}"
