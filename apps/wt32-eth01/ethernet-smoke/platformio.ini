[env:wt32-eth01]
platform = espressif32@6.12.0
board = wt32-eth01
framework = arduino

upload_speed = 115200
monitor_speed = 115200

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.filesystem = littlefs

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    ; Change this value to any available TCP port from 1 through 65535.
    -D VAYDENET_DASHBOARD_PORT=19691
    -I../../../../packages/VaydeEngine/include
