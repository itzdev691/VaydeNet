[env]
monitor_speed = 115200

[env:espnow_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
build_flags =
    -std=gnu++17
    -DVAYDENET_BOARD_MODEL=\"ESP32-S3-DevKitC-1\"
    -DVAYDENET_ACTIVITY_LED_GPIO=48
    -DVAYDENET_ACTIVITY_LED_ADDRESSABLE=1

[env:espnow_esp32s3_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = lolin_s3_mini
framework = espidf
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig-s3-mini.defaults"
build_flags =
    -std=gnu++17
    -DVAYDENET_BOARD_MODEL=\"WEMOS-LOLIN-S3-Mini\"
    -DVAYDENET_ACTIVITY_LED_GPIO=47
    -DVAYDENET_ACTIVITY_LED_ADDRESSABLE=1

[env:espnow_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = espidf
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig-c5.defaults"
build_flags =
    -std=gnu++17
    -DVAYDENET_BOARD_MODEL=\"ESP32-C5-DevKitC-1\"
    -DVAYDENET_ACTIVITY_LED_GPIO=27
    -DVAYDENET_ACTIVITY_LED_ADDRESSABLE=1

; Waveshare ESP32-P4-WIFI6-POE-ETH: 32 MB flash, onboard C6 over SDIO.
; This environment retains the pre-v3 silicon profile. Verify chip revision.
; ESP-NOW uses the P4 host bridge and requires matching C6 companion firmware.
[env:esp32p4_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig-p4-c6.defaults;sdkconfig-p4-pre-v3.defaults"
build_flags =
    -std=gnu++17
    -DVAYDENET_BOARD_MODEL=\"Waveshare-ESP32-P4-WIFI6-POE-ETH\"
    ; No verified activity LED pin; -1 makes GPIO LED initialization fail safely.
    -DVAYDENET_ACTIVITY_LED_GPIO=-1
    -DVAYDENET_ACTIVITY_LED_ACTIVE_HIGH_GPIO=1

; Same Waveshare board wiring, for P4 revision 3.0 and later.
[env:esp32p4_c6_rev3]
extends = env:esp32p4_c6
board = esp32-p4_r3-evboard
board_build.f_cpu = 360000000L
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig-p4-c6.defaults;sdkconfig-p4-rev3.defaults"

[env:espnow_esp32_doit]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = espidf
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig-doit.defaults"
build_flags =
    -std=gnu++17
    -DVAYDENET_BOARD_MODEL=\"DOIT-ESP32-DEVKIT-V1\"
    -DVAYDENET_ACTIVITY_LED_GPIO=2
    -DVAYDENET_ACTIVITY_LED_ACTIVE_HIGH_GPIO=1

[env:esp32-s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s2-saola-1
framework = espidf
build_flags =
    -std=gnu++17
    -DVAYDENET_BOARD_MODEL=\"ESP32-S2-Flipper-WiFi-DevBoard\"
    -DVAYDENET_ACTIVITY_LED_GPIO=5
    -DVAYDENET_ACTIVITY_LED_ACTIVE_LOW_GPIO=1
