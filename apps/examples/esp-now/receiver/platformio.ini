[env:esp32s3_receiver]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../../../../packages/VaydeEngine/include
lib_deps =
    moononournation/GFX Library for Arduino@1.6.0
