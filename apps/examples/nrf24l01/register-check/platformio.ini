[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall -Wextra -Werror

[env:nrf24_check_c5]
board = esp32-c5-devkitc-1

; Pre-v3 silicon must use the matching ESP-IDF memory layout.
[env:nrf24_check_p4]
board = esp32-p4-evboard
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="../../../node/sdkconfig-p4-pre-v3.defaults"

[env:nrf24_check_p4_rev3]
board = esp32-p4_r3-evboard
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="../../../node/sdkconfig-p4-rev3.defaults"
